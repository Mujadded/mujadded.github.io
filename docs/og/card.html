<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#111318;color:#eceef4;
    font-family:"Space Mono",ui-monospace,Menlo,monospace;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;padding:72px 76px}
  .top{display:flex;align-items:center;gap:20px}
  .mark{width:64px;height:64px;border-radius:999px;background:#a99dff;color:#111318;
    font-weight:700;font-size:23px;display:flex;align-items:center;justify-content:center}
  .site{font-size:20px;color:#868ea0;letter-spacing:0.02em}
  h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:88px;
    line-height:1.02;letter-spacing:-0.015em;max-width:17ch}
  .bar{height:4px;width:180px;background:#a99dff;border-radius:4px;margin:34px 0 30px}
  .role{font-size:25px;line-height:1.5;color:#b0b6c4;max-width:44ch}
  .role b{color:#eceef4;font-weight:400}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:19px;color:#868ea0}
  .foot .k{color:#a99dff}
</style></head><body>
  <div class="top"><span class="mark">MJ</span><span class="site">mjalif.com</span></div>
  <div>
    <h1>Mujadded Al&nbsp;Rabbani Alif</h1>
    <div class="bar"></div>
    <p class="role"><b>Research Associate in Computer Vision</b><br>University of Huddersfield</p>
  </div>
  <div class="foot">
    <span>Detection models for railway and industrial inspection</span>
    <span class="k">YOLO &middot; edge &middot; inspection</span>
  </div>
</body></html>
