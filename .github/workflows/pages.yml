name: Pages

# Builds the site on every PR so a broken Jekyll build shows red HERE instead of
# on the deploy path. On master it builds and then deploys - but only once the
# repo's Pages source has actually been switched to "GitHub Actions" (see the
# deploy job); until then the legacy branch deploy keeps publishing the site.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_sw_cache.py diffs against the commit before this change to
          # catch a precached file that changed without a cache-version bump -
          # needs real history, not the default single-commit checkout.
          fetch-depth: 0

      - name: Repo checks
        env:
          # Base commit for check_sw_cache.py's version-bump diff: the PR's
          # base for a pull_request run, the pre-push commit for a push run.
          SW_CACHE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 tests/check_jekyll_build.py
          python3 tests/check_homepage.py
          python3 tests/check_articles.py
          python3 tests/check_seo.py
          python3 tests/check_prose.py
          python3 tests/check_sw_cache.py

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The repo is currently Pages build_type "legacy" (source: branch master).
      # Deploying from Actions requires Settings -> Pages -> Source = "GitHub
      # Actions". Rather than fail every master run until someone flips that, ask
      # the API: this job starts deploying by itself the moment it is flipped.
      - name: Is Pages served from Actions yet?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo legacy)
          echo "Pages build_type: $type"
          echo "build_type=$type" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v4

      - name: Skipped
        if: steps.pages.outputs.build_type != 'workflow'
        run: echo "Pages still deploys from the master branch (legacy). Flip Settings -> Pages -> Source to 'GitHub Actions' to deploy from this workflow."
